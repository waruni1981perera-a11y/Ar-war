<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>AR WAR ZONE</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #080808;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #start h1 {
      font-size: 42px;
      letter-spacing: 4px;
    }

    #start button {
      background: #d71919;
      color: white;
      border: none;
      padding: 18px 35px;
      border-radius: 12px;
      font-size: 19px;
      font-weight: bold;
    }

    #message {
      position: fixed;
      z-index: 10;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.7);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    #tap {
      position: fixed;
      z-index: 10;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      background: #00b86b;
      color: white;
      border: none;
      padding: 17px 30px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      display: none;
    }

    #reticle {
      position: fixed;
      z-index: 10;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      width: 45px;
      height: 45px;
      border: 3px solid #00ff88;
      border-radius: 50%;
      display: none;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="start">

  <h1>⚔ AR WAR ZONE</h1>

  <p>LIVE AUGMENTED REALITY</p>

  <button onclick="startAR()">
    ENTER BATTLEFIELD
  </button>

</div>

<div id="message">
  Move your phone slowly and scan the ground...
</div>

<div id="reticle"></div>

<button id="tap" onclick="placeBattlefield()">
  PLACE BATTLEFIELD
</button>


<a-scene
  id="scene"
  embedded
  vr-mode-ui="enabled:false"
  renderer="colorManagement:true; physicallyCorrectLights:true"
  webxr="requiredFeatures: hit-test; optionalFeatures: dom-overlay"
  xr-mode-ui="enabled:true">

  <a-camera></a-camera>

  <a-entity
    light="type:ambient; intensity:1.5">
  </a-entity>

  <a-entity id="world">

    <!-- GROUND -->

    <a-plane
      rotation="-90 0 0"
      width="7"
      height="7"
      color="#30332b">
    </a-plane>


    <!-- TANK -->

    <a-entity id="tank"
              position="0 0.45 -1">

      <!-- BODY -->

      <a-box
        position="0 0 0"
        width="1.8"
        height=".55"
        depth="2.6"
        color="#4b553c">
      </a-box>

      <!-- TOP -->

      <a-box
        position="0 .4 0"
        width="1.3"
        height=".3"
        depth="1.4"
        color="#394331">
      </a-box>

      <!-- TURRET -->

      <a-cylinder
        position="0 .62 0"
        radius=".55"
        height=".25"
        color="#30382a">
      </a-cylinder>

      <!-- CANNON -->

      <a-cylinder
        position="0 .65 -.9"
        radius=".09"
        height="1.7"
        rotation="90 0 0"
        color="#171a14">
      </a-cylinder>

      <!-- TRACKS -->

      <a-box
        position="-1 -.25 0"
        width=".3"
        height=".6"
        depth="2.8"
        color="#111">
      </a-box>

      <a-box
        position="1 -.25 0"
        width=".3"
        height=".6"
        depth="2.8"
        color="#111">
      </a-box>

    </a-entity>


    <!-- SOLDIER 1 -->

    <a-entity position="-2 0 -1">

      <a-cylinder
        position="0 .8 0"
        radius=".2"
        height="1.3"
        color="#4d593f">
      </a-cylinder>

      <a-sphere
        position="0 1.55 0"
        radius=".22"
        color="#806548">
      </a-sphere>

    </a-entity>


    <!-- SOLDIER 2 -->

    <a-entity position="2 0 -1">

      <a-cylinder
        position="0 .8 0"
        radius=".2"
        height="1.3"
        color="#4d593f">
      </a-cylinder>

      <a-sphere
        position="0 1.55 0"
        radius=".22"
        color="#806548">
      </a-sphere>

    </a-entity>


    <!-- CRATER -->

    <a-cylinder
      position="-2 .02 1"
      radius=".6"
      height=".04"
      color="#111">
    </a-cylinder>


    <!-- WALL -->

    <a-box
      position="2 .7 1.5"
      width="2.5"
      height="1.4"
      depth=".25"
      color="#555048">
    </a-box>

  </a-entity>

</a-scene>


<script>

let scene;
let placed = false;

async function startAR() {

  document.getElementById("start").style.display = "none";

  document.getElementById("message").style.display = "block";

  document.getElementById("reticle").style.display = "block";

  scene = document.querySelector("#scene");

  try {

    await scene.enterVR();

  } catch(error) {

    console.log(error);

    document.getElementById("message").innerHTML =
      "AR is not supported on this browser/device.";

  }

}


/* PLACE BATTLEFIELD */

function placeBattlefield() {

  if (placed) return;

  placed = true;

  document.getElementById("message").innerHTML =
    "🔥 BATTLEFIELD DEPLOYED!";

  document.getElementById("tap").style.display = "none";

  document.getElementById("reticle").style.display = "none";

}


/* Detect AR session */

document.addEventListener("enter-vr", function() {

  document.getElementById("message").innerHTML =
    "SCAN THE GROUND...";

  document.getElementById("tap").style.display =
    "block";

});

</script>

</body>
</html>
